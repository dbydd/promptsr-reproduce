[project]
name = "promptsr-reproduce"
version = "0.1.0"
description = "PromptSR reproduction scaffold"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.2",
  "pytorch-lightning>=2.4",
  "torchmetrics>=1.4",
  "numpy>=1.26",
  "Pillow>=10.0",
  "pyyaml>=6.0",
  "tensorboardX>=2.6",
  "jupyterlab>=4.2",
  "ipykernel>=6.29",
  "matplotlib>=3.9",
  "pandas>=3.0.3",
]

[tool.uv]
package = true
